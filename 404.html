    h1 em { font-family: "Caveat", cursive; font-style: normal; color: var(--tan-texto); font-size: 1.3em; }

    .botones { display: flex; gap: .8rem; justify-content: center; margin-top: 1.8rem; flex-wrap: wrap; }
    .boton {
      display: inline-flex; align-items: center; gap: .5rem;
      font: inherit; font-weight: 800; font-size: .98rem;
      text-decoration: none; cursor: pointer;
      padding: .8rem 1.6rem; border-radius: 999px;
      border: 2px solid rgba(42, 51, 29, .25);
      color: var(--oliva-tinta); background: transparent;
      transition: background .2s, color .2s, transform .2s;
    }
    .boton:hover { transform: translateY(-2px); border-color: var(--oliva); }
    .boton-verde { background: var(--oliva); border-color: var(--oliva); color: var(--crema-3); }
    .boton-verde:hover { background: var(--oliva-osc); border-color: var(--oliva-osc); }
    .boton svg { width: 1.15em; height: 1.15em; }
